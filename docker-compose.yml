services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: broteens
      POSTGRES_PASSWORD: broteens
      POSTGRES_DB: broteens
    ports:
      - "5433:5432"
    volumes:
      - broteens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broteens -d broteens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - broteens-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  broteens-postgres:
  broteens-redis:
